
name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

jobs:
  title-check:
    name: Check HTML Title
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML title tag
        run: |
          if grep -Eiq '<title[^>]*>[^<]+' index.html; then
            echo "HTML title tag found."
          else
            echo "Error: HTML title tag is missing or empty."
            exit 1
          fi

  image-alt-check:
    name: Check Image Alt Attributes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check image alt attributes
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser

          class ImageChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.errors = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "img":
                      attributes = dict(attrs)
                      if "alt" not in attributes:
                          self.errors.append(
                              f"Image missing alt attribute: {attributes.get('src', '(no src)')}"
                          )

          checker = ImageChecker()

          with open("index.html", encoding="utf-8") as file:
              checker.feed(file.read())

          if checker.errors:
              for error in checker.errors:
                  print(error)
              raise SystemExit(1)

          print("All images have alt attributes.")
          PY

  console-log-check:
    name: Check Console Log Statements
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for console.log statements
        run: |
          if grep -RInE 'console\.log[[:space:]]*\(' js/ --include='*.js'; then
            echo "Error: Remove console.log statements before merging."
            exit 1
          else
            echo "No console.log statements found."
          fi

  final-summary:
    name: Final PR Validation Summary
    needs:
      - title-check
      - image-alt-check
      - console-log-check
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Display validation results
        run: |
          echo "Pull Request validation results:"
          echo "HTML title: ${{ needs.title-check.result }}"
          echo "Image alt attributes: ${{ needs.image-alt-check.result }}"
          echo "Console log check: ${{ needs.console-log-check.result }}"

          if [[ "${{ needs.title-check.result }}" != "success" ||
                "${{ needs.image-alt-check.result }}" != "success" ||
                "${{ needs.console-log-check.result }}" != "success" ]]; then
            echo "One or more PR checks failed."
            exit 1
          fi

          echo "All PR checks passed."
